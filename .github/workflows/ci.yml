name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.2.0
        with:
          cache: true
      - run: pnpm build
      - parallel:
          - run: pnpm format
          - run: pnpm lint
          - run: pnpm knip
          - run: pnpm check
          - run: pnpm verify
